<style>
/*
 * The cartographer's table: the palette, type and furniture both pages are drawn with.
 *
 * Inlined into map.html and spy.html ahead of their own stylesheets, so a colour is decided once
 * here and used by role everywhere else. Anything page-specific belongs in that page's file.
 *
 * One theme, deliberately. The design is a lit parchment table and has no night version; a dark
 * mode would be a second design, not a switch, and every scale on both pages was measured against
 * these surfaces rather than a pair of them.
 */

:root {
  color-scheme: light;

  /* Surfaces, from the table itself up to the sheets lying on it. */
  --bg: #f3f2f2;
  --surface: #eae9e9;
  --paper: #f8f4f4;
  --ink: #201f1d;
  --ink-soft: #605d5d;
  --ink-faint: #7d7979;
  --rule: #d7d3d3;
  --rule-soft: #eae7e7;

  /* Ochre. The one colour that means "look here" - anything else that catches the eye is data. */
  --accent: #b68235;
  --accent-deep: #7d5411;
  --accent-wash: #fff3e4;
  --accent-edge: #e1ad66;

  --shadow-sm: 0 1px 2px rgba(45, 43, 43, .14);
  --shadow-md: 0 3px 10px rgba(45, 43, 43, .16);
  --shadow-lg: 0 12px 32px rgba(45, 43, 43, .22);

  /* Small radii: a drawn table, not a dashboard. */

  --r-md: 4px;
  --r-lg: 7px;

  --s-1: 5px;
  --s-2: 9px;
  --s-3: 14px;
  --s-4: 18px;
  --s-6: 28px;
  --s-8: 37px;

  /* Every stack ends in a generic, because no embedded subset covers Japanese village names. */

  --font-figure: 'Lora', Georgia, serif;

* { box-sizing: border-box; }

body {

}

h1, h2, h3 {

  line-height: 1.15;

h1 { font-size: 30px; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }

/* A caption over a group of controls: small, spaced, and quiet enough to ignore once learned. */
.legend-label {
  font-size: 10.5px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* Numbers line up in columns wherever they appear - a table of figures that jitters is unreadable. */
.num, .figure b, td.num { font-variant-numeric: tabular-nums; }

/* ---- the bar across the top of every page ---- */

.tabs {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: 0 var(--s-4);

.tabs nav { display: flex; gap: 2px; margin-left: var(--s-2); }

.tabs a {
  padding: 5px 12px;
  border-radius: var(--r-md);
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 13.5px;
  white-space: nowrap;

.tabs a:hover { background: var(--surface); color: var(--ink); }

.tabs .aside {

  font-size: 12px;
  color: var(--ink-faint);

.tabs .who { color: var(--accent-deep); font-weight: 600; letter-spacing: .04em; }

.hr { border: 0; border-top: 1px solid var(--rule-soft); margin: var(--s-3) 0; }

.btn {

  font-size: 13px;

  border-radius: var(--r-md);
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}

.btn:hover { border-color: var(--accent-edge); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }

.btn-block { display: block; width: 100%; }

.input {

  font-size: 13.5px;

.input:focus {

<style>
/* The ledger. Theme first, then only what this page adds. */

:root {
  /* Watched, and nothing happened. The commonest cell, so it recedes into the sheet. */
  --quiet: #eae7e7;
  --quiet-edge: #ded9d9;

  /* Never watched. A hatch, never a paler shade - "no data" must not read as "asleep". */
  --unknown-ink: #bab6b6;

  /* One hue, palest to deepest, magnitude only. Re-stepped for parchment: on the old white the
     lightest step cleared 2:1, on #f8f4f4 it did not, so the whole ramp moved down one. */
  --heat-1: #6da7ec;
  --heat-2: #3987e5;
  --heat-3: #256abf;
  --heat-4: #184f95;
  --heat-5: #0d366b;

  --fell: #d03b3b;
  --grew: #0ca30c;
}

/* ---- the page itself ---- */

.ledger-head {
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--s-8) var(--s-4) var(--s-4);
}

.summary { margin: var(--s-2) 0 0; color: var(--ink-faint); font-size: 13px; }

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 var(--s-4) var(--s-8);
  display: grid;
  gap: var(--s-3);
}

.card > h2 { margin: 0 0 var(--s-1); }
.card > .note { margin: 0 0 var(--s-3); color: var(--ink-faint); font-size: 13px; }
.empty { color: var(--ink-faint); }

.caveat {
  margin: var(--s-4) 0 0;
  padding-top: var(--s-3);
  border-top: 1px solid var(--rule);
  color: var(--ink-faint);
  font-size: 12.5px;
  max-width: 74ch;
}

/* ---- the overview grid: a row per player, an hour per column ---- */

.grid { width: 100%; border-collapse: separate; border-spacing: 0; }

.grid th {
  font-weight: 500;
  font-size: 10px;
  color: var(--ink-faint);
  text-align: center;
  padding: 0 0 6px;
}

.grid th.who, .grid td.who {
  text-align: left;
  padding-right: 12px;
  white-space: nowrap;
}

.grid td.who { padding: 2px 12px 2px 0; }

.grid td.total {
  padding-left: 12px;
  color: var(--ink-faint);
  font-size: 12px;
  white-space: nowrap;
}

.who button {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  font-weight: 600;
  text-align: left;
}

.who button:hover { color: var(--accent-deep); text-decoration: underline; }
.who .tag { color: var(--ink-faint); font-weight: 400; font-size: 12px; margin-left: 6px; }

/* Forty-eight columns, not twenty-four, so each one has to be half the width it was. */
.cell {
  width: 12px;
  height: 15px;
  padding: 0;
}

.cell i {
  display: block;
  width: 100%;
  height: 100%;
}

/* Watched, and nothing happened. Also what the legend's own swatch inherits, so the two cannot
   drift apart - the legend has to be showing the same thing the grid is. */
.cell i, .legend i {
  border-radius: 2px;
  background: var(--quiet);
  box-shadow: inset 0 0 0 1px var(--quiet-edge);
}

/* Magnitude. Five steps is as many as anyone can tell apart at this size. Unscoped on purpose:
   the legend swatches carry the same attribute and must render identically. */
i[data-heat="1"] { background: var(--heat-1); box-shadow: none; }
i[data-heat="2"] { background: var(--heat-2); box-shadow: none; }
i[data-heat="3"] { background: var(--heat-3); box-shadow: none; }
i[data-heat="4"] { background: var(--heat-4); box-shadow: none; }
i[data-heat="5"] { background: var(--heat-5); box-shadow: none; }

/* Population fell. Off the activity ramp entirely - it is a different kind of fact, not a smaller
   amount of the same one - and in the reserved critical red, never a step of the blue. */
i[data-heat="-"] { background: var(--fell); box-shadow: none; }

/* An hour that both rose and fell keeps its activity shade and carries a corner, so the fall shows
   without overwriting what the player actually did. */
i[data-fell] { position: relative; }

i[data-fell]::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  border-left: 6px solid transparent;
  border-bottom: 6px solid var(--fell);
  border-bottom-right-radius: 2px;
}

/* Not watched: hatched, so it survives greyscale, print and forced colours. A paler step of the
   same ramp would be read as "quiet", which is the one thing it must never mean. */
i[data-heat="?"] {
  background:
    repeating-linear-gradient(
      135deg,
      transparent 0 3px,
      var(--unknown-ink) 3px 4px);
  box-shadow: inset 0 0 0 1px var(--quiet-edge);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  margin-top: 14px;
  color: var(--ink-faint);
  font-size: 12px;
}

.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 13px; height: 13px; border-radius: 2px; display: inline-block; }
.legend .scale { display: inline-flex; gap: 2px; }

/* ---- one player ---- */

/* Cleared past the sticky header, so jumping to a player does not tuck its name under it. */
.player { display: none; scroll-margin-top: 84px; }
.player.open { display: block; }

.player h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.player h2 .tag { color: var(--ink-faint); font-weight: 400; font-size: 12.5px; }

.villages { margin: 8px 0 18px; padding: 0; list-style: none; font-size: 13px; }
.villages li { padding: 2px 0; color: var(--ink-faint); }
.villages b { color: var(--ink); font-weight: 600; }
.villages .unwatched { opacity: .75; }

.figures { display: flex; flex-wrap: wrap; gap: 22px; margin: 0 0 16px; }
.figure { min-width: 96px; }
.figure b { display: block; font-size: 18px; font-weight: 600; }
.figure span { color: var(--ink-faint); font-size: 12px; }

.days { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 6px; }
.days td.who { font-size: 12px; color: var(--ink-faint); white-space: nowrap; padding-right: 12px; }

.moments { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.moments .day {
  margin: 14px 0 4px;
  color: var(--ink-faint);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.moments li {
  display: flex;
  gap: 14px;
  padding: 3px 0;
  border-top: 1px solid var(--quiet-edge);
}

.moments time { width: 70px; white-space: nowrap; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.moments .where { width: 96px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.moments .delta { width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.moments .delta.up { color: var(--grew); }
.moments .delta.down { color: var(--fell); }
.moments .pop { width: 72px; text-align: right; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.moments .gap { color: var(--ink-faint); }

.caveat {
  margin: 22px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  color: var(--ink-faint);
  font-size: 12.5px;
  max-width: 74ch;
}

.empty { color: var(--ink-faint); }

/* ---- the passcode curtain ---- */

.gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
}

.gateBox {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 240px;
}

.gateBox label { font-size: 12px; color: var(--ink-faint); }

.gateBox input, .gateBox button {
  font: inherit;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
}

.gateBox button { background: var(--accent-deep); color: #fff; border-color: transparent; cursor: pointer; }
.gateMessage { margin: 0; min-height: 1.2em; font-size: 12px; color: var(--fell); }

@media (max-width: 900px) {
  .cell { width: 8px; }
  .grid td.total { display: none; }
}

</style>
</head>

/*
 * The curtain, shared by all three pages.
 *
 * It is a curtain, not a lock: every page carries its whole payload, and the password along with
 * it, so anybody who opens the file in an editor has the lot whatever they type. What it buys is
 * that the page does not open on the map in front of somebody glancing over your shoulder.
 *
 * The map is the door and always asks. The ledger and the operation sheet are rooms behind it, and
 * being stopped again on the way through is friction with nothing behind it, so the browser
 * remembers the password that worked on the map and those two honour it. What is stored is the
 * password itself, which means changing it in the generator draws the curtain again everywhere
 * instead of leaving old browsers standing open.
 */
(function () {
  'use strict';

  var KEY = 'tvn.seal';

  function remembered() {
    try {
      return window.localStorage.getItem(KEY);
    } catch (e) {
      // Private browsing, or storage turned off. Then every page asks, as it used to.
      return null;
    }
  }

  function remember(value) {
    try {
      window.localStorage.setItem(KEY, value);
    } catch (e) {
      // Nothing to do about it, and nothing worth holding the page for.
    }
  }

  /**
   * Lifts the curtain - now, if this browser has already answered, otherwise when the right
   * password is typed - and calls `onOpen` once it is up. A page with no curtain, or one generated
   * without a password, opens straight away.
   *
   * `opts.alwaysAsk` is the door: that page ignores whatever the browser remembers and puts the
   * form up every time. It still writes the seal on the way through, which is what spares the
   * pages behind it.
   */
  window.tvnGate = function (passcode, onOpen, opts) {
    var alwaysAsk = !!(opts && opts.alwaysAsk);
    var expected = (passcode === undefined || passcode === null) ? null : String(passcode);
    var gate = document.getElementById('gate');

    var open = function () {
      if (gate) {
        gate.remove();
      }

      document.body.classList.remove('locked');

      if (onOpen) {
        onOpen();
      }
    };

    if (!gate || expected === null || (!alwaysAsk && remembered() === expected)) {
      open();
      return;
    }

    var field = document.getElementById('gateInput');
    var message = document.getElementById('gateMessage');

    document.getElementById('gateForm').addEventListener('submit', function (event) {
      event.preventDefault();

      if (field.value.trim() !== expected) {
        message.textContent = 'Not that one.';
        field.select();
        return;
      }

      remember(expected);
      open();
    });

    field.addEventListener('input', function () { message.textContent = ''; });
    field.focus();
  };
})();

</script>
<script>
/*
 * The spy page. Everything it draws comes out of the JSON block above it.
 *
 * The one rule worth stating: three states of an hour must stay distinguishable — busy, watched but
 * quiet, and never watched. The third is not a paler shade of the second; it is hatched. A heatmap
 * that renders "we weren't looking" as "nothing happened" invents sleep the player never had.
 */
(function () {
  'use strict';

  const data = JSON.parse(document.getElementById('data').textContent);
  const page = document.getElementById('page');

  /**
   * Half-hours in a day. The watch goes round every 28 to 32 minutes, so this is about as fine as
   * the record can honestly be cut, and it is the grain the report is built at.
   */
  const SLOTS = 48;

  /** Which half-hour a moment falls in, and how to say it. */
  const slotOf = (at) => at.getHours() * 2 + (at.getMinutes() >= 30 ? 1 : 0);
  const slotLabel = (slot) =>
    String(Math.floor(slot / 2)).padStart(2, '0') + ':' + (slot % 2 ? '30' : '00');
  const $ = (id) => document.getElementById(id);

  /* ---- small helpers ------------------------------------------------ */

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + 's')}`;

  /** A duration a person can read at a glance. */
  const span = (seconds) => {
    if (seconds >= 86400) return `${Math.floor(seconds / 86400)}d ${Math.floor((seconds % 86400) / 3600)}h`;
    if (seconds >= 3600) return `${Math.floor(seconds / 3600)}h ${String(Math.floor((seconds % 3600) / 60)).padStart(2, '0')}m`;
    return `${Math.max(0, Math.round(seconds / 60))}m`;
  };

  const dayKey = (date) =>
    `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

  /**
   * Five steps of magnitude, and no more: past five nobody can tell one shade from the next, so the
   * top step means "five or more" and the tooltip carries the real number.
   *
   * A fall is not one of the steps. It is its own mark, because a village shrinking is somebody
   * else's catapults or its own troops starving — not its owner being awake — and shading it as
   * activity would put a player at the keyboard precisely when they were not.
   */
  const heat = (gains, losses, watched) => {
    if (gains > 0) return String(Math.min(5, gains));
    if (losses > 0) return '-';
    return watched ? '' : '?';
  };

  const cellTitle = (label, gains, losses, watched) => {
    const parts = [];
    if (gains > 0) parts.push(plural(gains, 'rise'));
    if (losses > 0) parts.push(plural(losses, 'fall'));
    if (parts.length) return `${label} - ${parts.join(', ')}`;
    return watched ? `${label} - watched, nothing changed` : `${label} - not watched`;
  };

  /* ---- reshaping the payload into the reader's own clock ------------ */

  /*
   * Instants go in, local hours come out. The report was built where the file was generated; the
   * question being asked is about the hour of the reader's day, so the buckets are rebuilt here.
   */
  const prepare = (player) => {
    const moments = player.moments.map((moment) => {
      const at = new Date(moment.at);
      return { ...moment, date: at, slot: slotOf(at), key: dayKey(at) };
    });

    // Coverage arrives already bucketed per calendar day and hour, and those buckets were made
    // where the file was written. Shifting them here would be inventing precision we do not have,
    // so they are used as given and only the changes follow the reader's clock.
    const coverage = new Map();
    for (const day of player.days) {
      coverage.set(day.date, day.watched);
    }

    const empty = () => ({ gains: new Array(SLOTS).fill(0), losses: new Array(SLOTS).fill(0) });

    const byHour = empty();
    const byDay = new Map();
    for (const moment of moments) {
      const kind = moment.delta > 0 ? 'gains' : 'losses';
      byHour[kind][moment.slot]++;
      if (!byDay.has(moment.key)) byDay.set(moment.key, empty());
      byDay.get(moment.key)[kind][moment.slot]++;
    }

    const watchedSlot = new Array(SLOTS).fill(0);
    for (const rounds of coverage.values()) {
      for (let slot = 0; slot < SLOTS; slot++) watchedSlot[slot] += rounds[slot] || 0;
    }

    // A change of either kind is its own proof that somebody was looking, whatever the round log
    // says - we cannot have seen a village shrink in an hour we were not watching it.
    for (let slot = 0; slot < SLOTS; slot++) {
      if (byHour.gains[slot] > 0 || byHour.losses[slot] > 0) {
        watchedSlot[slot] = Math.max(watchedSlot[slot], 1);
      }
    }

    return { ...player, moments, byHour, byDay, coverage, watchedSlot, empty };
  };

  const players = data.players.map(prepare);

  /* ---- the header --------------------------------------------------- */

  const since = data.since ? new Date(data.since) : null;
  $('summary').textContent = [
    plural(players.length, 'player'),
    plural(players.reduce((sum, p) => sum + p.villages.filter((v) => v.watched).length, 0), 'village'),
    since ? `since ${since.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} ${since.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}` : 'nothing watched yet',
    `${data.days.toLocaleString(undefined, { maximumFractionDigits: 1 })} days`,
    plural(data.rounds, 'round'),
  ].join('  ·  ');

  /* ---- the hour scale, shared by both grids ------------------------- */

  const slotHead = (leading) => {
    const row = el('tr');
    row.appendChild(el('th', 'who', leading));
    for (let slot = 0; slot < SLOTS; slot++) {
      // Labelled every second hour, which is every fourth mark - any closer and the numbers
      // collide at this cell width.
      row.appendChild(el('th', null, slot % 4 === 0 ? String(slot / 2).padStart(2, '0') : ''));
    }
    return row;
  };

  const slotCells = (row, counts, watched, label) => {
    for (let slot = 0; slot < SLOTS; slot++) {
      const gains = counts.gains[slot] || 0;
      const losses = counts.losses[slot] || 0;
      const seen = (watched[slot] || 0) > 0;

      const cell = el('td', 'cell');
      const mark = el('i');
      const level = heat(gains, losses, seen);
      if (level) mark.dataset.heat = level;

      // An hour that both rose and fell keeps its activity shade and gains a corner: the fall is
      // still worth seeing, and it must not overwrite what the player actually did.
      if (gains > 0 && losses > 0) mark.dataset.fell = '1';

      mark.title = cellTitle(`${label} ${slotLabel(slot)}`, gains, losses, seen);
      cell.appendChild(mark);
      row.appendChild(cell);
    }
  };

  /* ---- the overview -------------------------------------------------- */

  const overview = el('section', 'card');
  overview.appendChild(el('h2', null, 'Everyone, by time of day'));
  overview.appendChild(el('p', 'note',
    'Each square is half an hour, across every day watched. Pick a name to read that player in full.'));

  if (players.length === 0) {
    overview.appendChild(el('p', 'empty', 'Nothing has been watched yet.'));
  } else {
    const table = el('table', 'grid');
    const head = el('thead');
    head.appendChild(slotHead('player'));
    table.appendChild(head);

    const body = el('tbody');
    for (const player of players) {
      const row = el('tr');
      const who = el('td', 'who');
      const button = el('button', null, player.name);
      button.type = 'button';
      button.addEventListener('click', () => open(player.name));
      who.appendChild(button);
      if (player.alliance) who.appendChild(el('span', 'tag', player.alliance));
      row.appendChild(who);

      slotCells(row, player.byHour, player.watchedSlot, 'all days,');
      row.appendChild(el('td', 'total',
        plural(player.gains, 'rise') + (player.losses > 0 ? `, ${player.losses} fell` : '')));
      body.appendChild(row);
    }

    table.appendChild(body);
    overview.appendChild(table);

    const legend = el('div', 'legend');
    const scale = el('span');
    scale.appendChild(el('span', null, 'busier'));
    const swatches = el('span', 'scale');
    for (let step = 1; step <= 5; step++) {
      const swatch = el('i');
      swatch.dataset.heat = String(step);
      swatches.appendChild(swatch);
    }
    scale.appendChild(swatches);
    legend.appendChild(scale);

    const quiet = el('span');
    quiet.appendChild(el('i'));
    quiet.appendChild(el('span', null, 'watched, nothing changed'));
    legend.appendChild(quiet);

    const fell = el('span');
    const fellMark = el('i');
    fellMark.dataset.heat = '-';
    fell.appendChild(fellMark);
    fell.appendChild(el('span', null, 'population fell - not counted as activity'));
    legend.appendChild(fell);

    const unknown = el('span');
    const unknownMark = el('i');
    unknownMark.dataset.heat = '?';
    unknown.appendChild(unknownMark);
    unknown.appendChild(el('span', null, 'not watched - nothing is known about this half-hour'));
    legend.appendChild(unknown);

    overview.appendChild(legend);
  }

  page.appendChild(overview);

  /* ---- one player, in full ------------------------------------------- */

  const detail = (player) => {
    const card = el('section', 'card player');
    card.dataset.player = player.name;

    const title = el('h2');
    title.appendChild(el('span', null, player.name));
    const tags = [player.alliance, player.tribe, player.id ? `id ${player.id}` : null].filter(Boolean);
    if (tags.length) title.appendChild(el('span', 'tag', tags.join('  ·  ')));
    card.appendChild(title);

    const villages = el('ul', 'villages');
    for (const village of player.villages) {
      const item = el('li', village.watched ? null : 'unwatched');
      const name = el('b', null, `(${village.x}|${village.y})`);
      item.appendChild(name);
      item.appendChild(document.createTextNode(
        ` ${village.name || '?'} — ${village.population.toLocaleString()}`
        + (village.capital ? ' · capital' : '')
        + (village.watched ? '' : ' · not watched')));
      villages.appendChild(item);
    }

    if (player.moreVillages) {
      villages.appendChild(el('li', 'unwatched',
        `…and ${player.moreVillages.toLocaleString()} more, not listed`));
    }

    card.appendChild(villages);

    const figures = el('div', 'figures');
    const figure = (value, label) => {
      const box = el('div', 'figure');
      box.appendChild(el('b', null, value));
      box.appendChild(el('span', null, label));
      return box;
    };

    const busiest = run(player.byHour, player.watchedSlot, true);
    const quietest = run(player.byHour, player.watchedSlot, false);

    // Rise to rise, not change to change: a village losing population in the small hours would
    // otherwise cut the stretch in two and hide the very quiet being looked for.
    let longest = null;
    let previous = null;
    for (const moment of player.moments.filter((m) => m.delta > 0)) {
      const gap = previous === null ? moment.since : (moment.date - previous) / 1000;
      if (longest === null || gap > longest) longest = gap;
      previous = moment.date;
    }

    figures.appendChild(figure(player.gains.toLocaleString(), 'rises seen'));
    if (player.losses > 0) figures.appendChild(figure(player.losses.toLocaleString(), 'falls'));
    figures.appendChild(figure(
      (player.growth > 0 ? '+' : '') + player.growth.toLocaleString(), 'population'));
    figures.appendChild(figure(player.perDay.toLocaleString(undefined, { maximumFractionDigits: 1 }), 'a day'));
    if (busiest) figures.appendChild(figure(busiest, 'busiest'));
    if (quietest) figures.appendChild(figure(quietest, 'quietest'));
    if (longest !== null) figures.appendChild(figure(span(longest), 'longest gap'));
    card.appendChild(figures);

    // Day by day. Coverage is per calendar day, so a day the watch never ran reads as unknown
    // throughout rather than being averaged away.
    const dates = [...player.coverage.keys()].sort();
    if (dates.length) {
      const table = el('table', 'days');
      const head = el('thead');
      head.appendChild(slotHead('day'));
      table.appendChild(head);

      const body = el('tbody');
      for (const date of dates.slice(-21)) {
        const row = el('tr');
        const when = new Date(`${date}T12:00:00`);
        row.appendChild(el('td', 'who',
          when.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })));
        slotCells(row, player.byDay.get(date) || player.empty(), player.coverage.get(date) || [], date);
        body.appendChild(row);
      }

      table.appendChild(body);
      card.appendChild(table);
    }

    const list = el('ul', 'moments');
    if (player.moments.length === 0) {
      list.appendChild(el('li', 'empty', 'Nothing has moved since the watch began.'));
    }

    let seen = null;
    for (const moment of player.moments) {
      if (moment.key !== seen) {
        list.appendChild(el('li', 'day',
          moment.date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })));
        seen = moment.key;
      }

      const item = el('li');
      const time = el('time', null,
        moment.date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }));
      time.dateTime = moment.at;
      item.appendChild(time);
      item.appendChild(el('span', 'where', `(${moment.x}|${moment.y})`));
      item.appendChild(el('span', `delta ${moment.delta < 0 ? 'down' : 'up'}`,
        (moment.delta > 0 ? '+' : '') + moment.delta));
      item.appendChild(el('span', 'pop', moment.population.toLocaleString()));
      item.appendChild(el('span', 'gap', `after ${span(moment.since)} quiet`));
      list.appendChild(item);
    }

    card.appendChild(list);
    return card;
  };

  /**
   * The longest stretch of hours that are busy, or that were watched and quiet. Hours nobody watched
   * break a quiet run rather than extending it - an unwatched hour is not a quiet one.
   */
  function run(byHour, watched, busy) {
    // Gains only, both ways round. An hour holding nothing but a loss is a quiet hour for this
    // player: somebody was busy in it, but it was not them.
    const matches = (slot) => busy
      ? byHour.gains[slot] > 0
      : (watched[slot] || 0) > 0 && !byHour.gains[slot];

    let all = true;
    for (let slot = 0; slot < SLOTS; slot++) if (!matches(slot)) all = false;
    if (all) return null;

    let best = null;
    let bestScore = 0;
    for (let start = 0; start < SLOTS; start++) {
      if (!matches(start) || matches((start + SLOTS - 1) % SLOTS)) continue;

      let length = 0;
      let weight = 0;
      while (length < SLOTS && matches((start + length) % SLOTS)) {
        weight += byHour.gains[(start + length) % SLOTS] || 0;
        length++;
      }

      // Busiest is by weight - a long thin stretch is not a busier time than a short crowded one.
      const score = busy ? weight * 100 + length : length;
      if (score > bestScore) {
        bestScore = score;
        best = `${slotLabel(start)}-${slotLabel((start + length - 1) % SLOTS)}`;
      }
    }

    return best;
  }

  const cards = new Map();
  for (const player of players) {
    const card = detail(player);
    cards.set(player.name, card);
    page.appendChild(card);
  }

  function open(name) {
    for (const [key, card] of cards) card.classList.toggle('open', key === name);
    const card = cards.get(name);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  if (players.length === 1) open(players[0].name);

  const caveat = el('p', 'caveat',
    'Hours are yours, not theirs. A blue mark is a population rise — a building finishing, which '
    + 'trails whenever it was queued, so this is activity rather than proof of being online. A red '
    + 'mark is a fall, and is not counted as activity at all: a village shrinks when it is '
    + 'catapulted or its troops starve, which is somebody being attacked rather than somebody being '
    + 'awake. A half-hour is only quiet where somebody was watching it; hatched ones are where nothing '
    + 'is known about.'
    + (data.unwatchedSlots > 0
      ? ` ${data.unwatchedSlots} half-hour${data.unwatchedSlots === 1 ? ' of the day has' : 's of the day have'} never been watched.`
      : ''));
  page.appendChild(caveat);

  /* ---- the passcode curtain ------------------------------------------ */

  tvnGate(data.passcode);
})();

</script>
</body>
</html>
