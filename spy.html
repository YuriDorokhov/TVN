<style>
/* Styles for the generated spy page. Inlined into the output by HtmlSpyRenderer. */

:root {
  color-scheme: light dark;

  --bg: #eef0f4;
  --panel-bg: #ffffff;
  --panel-border: #d5d9e0;
  --text: #1d2129;
  --text-dim: #6b7280;
  --accent: #2f6feb;
  --shadow: 0 1px 3px rgba(15, 23, 42, .14);

  /* Watched, and nothing happened. The commonest cell, so it recedes: any colour means activity. */
  --quiet: #f4f5f7;
  --quiet-edge: #e3e6eb;

  /* Never watched. A hatch rather than a shade - "no data" must never read as "asleep", and a
     paler step of the same ramp is exactly how that mistake gets made. */
  --unknown-ink: #b9bec7;

  /* One hue, light to dark, magnitude only. Validated against the panel white above: monotone
     lightness, visible gaps, and the lightest step clears 2:1 so one change is never invisible. */
  --heat-1: #86b6ef;
  --heat-2: #5598e7;
  --heat-3: #2a78d6;
  --heat-4: #1c5cab;
  --heat-5: #0d366b;

  --grew: #0ca30c;
  --shrank: #d03b3b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216;
    --panel-bg: #1a1d23;
    --panel-border: #2b3039;
    --text: #e6e8ec;
    --text-dim: #98a2b3;
    --accent: #5b9dff;
    --shadow: 0 1px 3px rgba(0, 0, 0, .55);

    --quiet: #212530;
    --quiet-edge: #2b3039;
    --unknown-ink: #4a515f;

    /* Stepped for the dark surface, not flipped: low stays nearest the surface, high furthest. */
    --heat-1: #184f95;
    --heat-2: #256abf;
    --heat-3: #3987e5;
    --heat-4: #6da7ec;
    --heat-5: #b7d3f6;

    --grew: #35c035;
    --shrank: #f06a6a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0 0 48px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
}

.top {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--panel-border);
  background: var(--panel-bg);
  position: sticky;
  top: 0;
  z-index: 5;
}

.top h1 { margin: 0; font-size: 20px; font-weight: 600; }
.back { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
.back:hover { text-decoration: underline; }
.summary { margin: 2px 0 0; color: var(--text-dim); font-size: 12.5px; }

.page { padding: 20px 24px; max-width: 1180px; margin: 0 auto; }

.card {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 16px 18px;
  margin: 0 0 18px;
}

.card > h2 {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 600;
}

.card > .note { margin: 0 0 14px; color: var(--text-dim); font-size: 12.5px; }

/* ---- the overview grid: a row per player, an hour per column ---- */

.grid { width: 100%; border-collapse: separate; border-spacing: 0; }

.grid th {
  font-weight: 500;
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  padding: 0 0 6px;
}

.grid th.who, .grid td.who {
  text-align: left;
  padding-right: 12px;
  white-space: nowrap;
}

.grid td.who { padding: 2px 12px 2px 0; }

.grid td.total {
  padding-left: 12px;
  color: var(--text-dim);
  font-size: 12px;
  white-space: nowrap;
}

.who button {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
  text-align: left;
}

.who button:hover { color: var(--accent); text-decoration: underline; }
.who .tag { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }

.cell {
  width: 22px;
  height: 20px;
  padding: 0;
}

.cell i {
  display: block;
  width: 100%;
  height: 100%;
}

/* Watched, and nothing happened. Also what the legend's own swatch inherits, so the two cannot
   drift apart - the legend has to be showing the same thing the grid is. */
.cell i, .legend i {
  border-radius: 3px;
  background: var(--quiet);
  box-shadow: inset 0 0 0 1px var(--quiet-edge);
}

/* Magnitude. Five steps is as many as anyone can tell apart at this size. Unscoped on purpose:
   the legend swatches carry the same attribute and must render identically. */
i[data-heat="1"] { background: var(--heat-1); box-shadow: none; }
i[data-heat="2"] { background: var(--heat-2); box-shadow: none; }
i[data-heat="3"] { background: var(--heat-3); box-shadow: none; }
i[data-heat="4"] { background: var(--heat-4); box-shadow: none; }
i[data-heat="5"] { background: var(--heat-5); box-shadow: none; }

/* Not watched: hatched, so it survives greyscale, print and forced colours. A paler step of the
   same ramp would be read as "quiet", which is the one thing it must never mean. */
i[data-heat="?"] {
  background:
    repeating-linear-gradient(
      135deg,
      transparent 0 3px,
      var(--unknown-ink) 3px 4px);
  box-shadow: inset 0 0 0 1px var(--quiet-edge);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  margin-top: 14px;
  color: var(--text-dim);
  font-size: 12px;
}

.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.legend .scale { display: inline-flex; gap: 2px; }

/* ---- one player ---- */

/* Cleared past the sticky header, so jumping to a player does not tuck its name under it. */
.player { display: none; scroll-margin-top: 84px; }
.player.open { display: block; }

.player h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.player h2 .tag { color: var(--text-dim); font-weight: 400; font-size: 12.5px; }

.villages { margin: 8px 0 18px; padding: 0; list-style: none; font-size: 13px; }
.villages li { padding: 2px 0; color: var(--text-dim); }
.villages b { color: var(--text); font-weight: 600; }
.villages .unwatched { opacity: .75; }

.figures { display: flex; flex-wrap: wrap; gap: 22px; margin: 0 0 16px; }
.figure { min-width: 96px; }
.figure b { display: block; font-size: 18px; font-weight: 600; }
.figure span { color: var(--text-dim); font-size: 12px; }

.days { width: 100%; border-collapse: separate; border-spacing: 0; margin-bottom: 6px; }
.days td.who { font-size: 12px; color: var(--text-dim); white-space: nowrap; padding-right: 12px; }

.moments { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.moments .day {
  margin: 14px 0 4px;
  color: var(--text-dim);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.moments li {
  display: flex;
  gap: 14px;
  padding: 3px 0;
  border-top: 1px solid var(--quiet-edge);
}

.moments time { width: 70px; white-space: nowrap; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.moments .where { width: 96px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.moments .delta { width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.moments .delta.up { color: var(--grew); }
.moments .delta.down { color: var(--shrank); }
.moments .pop { width: 72px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.moments .gap { color: var(--text-dim); }

.caveat {
  margin: 22px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--panel-border);
  color: var(--text-dim);
  font-size: 12.5px;
  max-width: 74ch;
}

.empty { color: var(--text-dim); }

/* ---- the passcode curtain ---- */

.gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.gateBox {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 240px;
}

.gateBox label { font-size: 12px; color: var(--text-dim); }

.gateBox input, .gateBox button {
  font: inherit;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--panel-border);
  background: var(--bg);
  color: var(--text);
}

.gateBox button { background: var(--accent); color: #fff; border-color: transparent; cursor: pointer; }
.gateMessage { margin: 0; min-height: 1.2em; font-size: 12px; color: var(--shrank); }

@media (max-width: 900px) {
  .cell { width: 14px; }
  .grid td.total { display: none; }
}

</style>
</head>

  </form>
</div>

<script>
/*
 * The spy page. Everything it draws comes out of the JSON block above it.
 *
 * The one rule worth stating: three states of an hour must stay distinguishable — busy, watched but
 * quiet, and never watched. The third is not a paler shade of the second; it is hatched. A heatmap
 * that renders "we weren't looking" as "nothing happened" invents sleep the player never had.
 */
(function () {
  'use strict';

  const data = JSON.parse(document.getElementById('data').textContent);
  const page = document.getElementById('page');

  const HOURS = 24;
  const $ = (id) => document.getElementById(id);

  /* ---- small helpers ------------------------------------------------ */

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + 's')}`;

  /** A duration a person can read at a glance. */
  const span = (seconds) => {
    if (seconds >= 86400) return `${Math.floor(seconds / 86400)}d ${Math.floor((seconds % 86400) / 3600)}h`;
    if (seconds >= 3600) return `${Math.floor(seconds / 3600)}h ${String(Math.floor((seconds % 3600) / 60)).padStart(2, '0')}m`;
    return `${Math.max(0, Math.round(seconds / 60))}m`;
  };

  const dayKey = (date) =>
    `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

  /**
   * Five steps of magnitude, and no more: past five nobody can tell one shade from the next, so the
   * top step means "five or more" and the tooltip carries the real number.
   */
  const heat = (changes, watched) => {
    if (changes > 0) return String(Math.min(5, changes));
    return watched ? '' : '?';
  };

  const cellTitle = (label, changes, watched) => {
    if (changes > 0) return `${label} - ${plural(changes, 'change')}`;
    return watched ? `${label} - watched, nothing changed` : `${label} - not watched`;
  };

  /* ---- reshaping the payload into the reader's own clock ------------ */

  /*
   * Instants go in, local hours come out. The report was built where the file was generated; the
   * question being asked is about the hour of the reader's day, so the buckets are rebuilt here.
   */
  const prepare = (player) => {
    const moments = player.moments.map((moment) => {
      const at = new Date(moment.at);
      return { ...moment, date: at, hour: at.getHours(), key: dayKey(at) };
    });

    // Coverage arrives already bucketed per calendar day and hour, and those buckets were made
    // where the file was written. Shifting them here would be inventing precision we do not have,
    // so they are used as given and only the changes follow the reader's clock.
    const coverage = new Map();
    for (const day of player.days) {
      coverage.set(day.date, day.watched);
    }

    const byHour = new Array(HOURS).fill(0);
    const byDay = new Map();
    for (const moment of moments) {
      byHour[moment.hour]++;
      if (!byDay.has(moment.key)) byDay.set(moment.key, new Array(HOURS).fill(0));
      byDay.get(moment.key)[moment.hour]++;
    }

    const watchedHour = new Array(HOURS).fill(0);
    for (const rounds of coverage.values()) {
      for (let hour = 0; hour < HOURS; hour++) watchedHour[hour] += rounds[hour] || 0;
    }

    // A change is its own proof that somebody was looking, whatever the round log says.
    for (let hour = 0; hour < HOURS; hour++) {
      if (byHour[hour] > 0) watchedHour[hour] = Math.max(watchedHour[hour], 1);
    }

    return { ...player, moments, byHour, byDay, coverage, watchedHour };
  };

  const players = data.players.map(prepare);

  /* ---- the header --------------------------------------------------- */

  const since = data.since ? new Date(data.since) : null;
  $('summary').textContent = [
    plural(players.length, 'player'),
    plural(players.reduce((sum, p) => sum + p.villages.filter((v) => v.watched).length, 0), 'village'),
    since ? `since ${since.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} ${since.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}` : 'nothing watched yet',
    `${data.days.toLocaleString(undefined, { maximumFractionDigits: 1 })} days`,
    plural(data.rounds, 'round'),
  ].join('  ·  ');

  /* ---- the hour scale, shared by both grids ------------------------- */

  const hourHead = (leading) => {
    const row = el('tr');
    row.appendChild(el('th', 'who', leading));
    for (let hour = 0; hour < HOURS; hour++) {
      row.appendChild(el('th', null, hour % 2 === 0 ? String(hour).padStart(2, '0') : ''));
    }
    return row;
  };

  const hourCells = (row, counts, watched, label) => {
    for (let hour = 0; hour < HOURS; hour++) {
      const changes = counts[hour] || 0;
      const cell = el('td', 'cell');
      const mark = el('i');
      const level = heat(changes, (watched[hour] || 0) > 0);
      if (level) mark.dataset.heat = level;
      mark.title = cellTitle(`${label} ${String(hour).padStart(2, '0')}:00`, changes, (watched[hour] || 0) > 0);
      cell.appendChild(mark);
      row.appendChild(cell);
    }
  };

  /* ---- the overview -------------------------------------------------- */

  const overview = el('section', 'card');
  overview.appendChild(el('h2', null, 'Everyone, by hour of the day'));
  overview.appendChild(el('p', 'note',
    'Each square is one hour, across every day watched. Pick a name to read that player in full.'));

  if (players.length === 0) {
    overview.appendChild(el('p', 'empty', 'Nothing has been watched yet.'));
  } else {
    const table = el('table', 'grid');
    const head = el('thead');
    head.appendChild(hourHead('player'));
    table.appendChild(head);

    const body = el('tbody');
    for (const player of players) {
      const row = el('tr');
      const who = el('td', 'who');
      const button = el('button', null, player.name);
      button.type = 'button';
      button.addEventListener('click', () => open(player.name));
      who.appendChild(button);
      if (player.alliance) who.appendChild(el('span', 'tag', player.alliance));
      row.appendChild(who);

      hourCells(row, player.byHour, player.watchedHour, 'all days,');
      row.appendChild(el('td', 'total', plural(player.changes, 'change')));
      body.appendChild(row);
    }

    table.appendChild(body);
    overview.appendChild(table);

    const legend = el('div', 'legend');
    const scale = el('span');
    scale.appendChild(el('span', null, 'busier'));
    const swatches = el('span', 'scale');
    for (let step = 1; step <= 5; step++) {
      const swatch = el('i');
      swatch.dataset.heat = String(step);
      swatches.appendChild(swatch);
    }
    scale.appendChild(swatches);
    legend.appendChild(scale);

    const quiet = el('span');
    quiet.appendChild(el('i'));
    quiet.appendChild(el('span', null, 'watched, nothing changed'));
    legend.appendChild(quiet);

    const unknown = el('span');
    const unknownMark = el('i');
    unknownMark.dataset.heat = '?';
    unknown.appendChild(unknownMark);
    unknown.appendChild(el('span', null, 'not watched - nothing is known about this hour'));
    legend.appendChild(unknown);

    overview.appendChild(legend);
  }

  page.appendChild(overview);

  /* ---- one player, in full ------------------------------------------- */

  const detail = (player) => {
    const card = el('section', 'card player');
    card.dataset.player = player.name;

    const title = el('h2');
    title.appendChild(el('span', null, player.name));
    const tags = [player.alliance, player.tribe, player.id ? `id ${player.id}` : null].filter(Boolean);
    if (tags.length) title.appendChild(el('span', 'tag', tags.join('  ·  ')));
    card.appendChild(title);

    const villages = el('ul', 'villages');
    for (const village of player.villages) {
      const item = el('li', village.watched ? null : 'unwatched');
      const name = el('b', null, `(${village.x}|${village.y})`);
      item.appendChild(name);
      item.appendChild(document.createTextNode(
        ` ${village.name || '?'} — ${village.population.toLocaleString()}`
        + (village.capital ? ' · capital' : '')
        + (village.watched ? '' : ' · not watched')));
      villages.appendChild(item);
    }

    card.appendChild(villages);

    const figures = el('div', 'figures');
    const figure = (value, label) => {
      const box = el('div', 'figure');
      box.appendChild(el('b', null, value));
      box.appendChild(el('span', null, label));
      return box;
    };

    const busiest = run(player.byHour, player.watchedHour, true);
    const quietest = run(player.byHour, player.watchedHour, false);
    const longest = player.moments.reduce((worst, m) => (!worst || m.since > worst.since ? m : worst), null);

    figures.appendChild(figure(player.changes.toLocaleString(), 'changes seen'));
    figures.appendChild(figure(
      (player.growth > 0 ? '+' : '') + player.growth.toLocaleString(), 'population'));
    figures.appendChild(figure(player.perDay.toLocaleString(undefined, { maximumFractionDigits: 1 }), 'a day'));
    if (busiest) figures.appendChild(figure(busiest, 'busiest'));
    if (quietest) figures.appendChild(figure(quietest, 'quietest'));
    if (longest) figures.appendChild(figure(span(longest.since), 'longest gap'));
    card.appendChild(figures);

    // Day by day. Coverage is per calendar day, so a day the watch never ran reads as unknown
    // throughout rather than being averaged away.
    const dates = [...player.coverage.keys()].sort();
    if (dates.length) {
      const table = el('table', 'days');
      const head = el('thead');
      head.appendChild(hourHead('day'));
      table.appendChild(head);

      const body = el('tbody');
      for (const date of dates.slice(-21)) {
        const row = el('tr');
        const when = new Date(`${date}T12:00:00`);
        row.appendChild(el('td', 'who',
          when.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })));
        hourCells(row, player.byDay.get(date) || [], player.coverage.get(date) || [], date);
        body.appendChild(row);
      }

      table.appendChild(body);
      card.appendChild(table);
    }

    const list = el('ul', 'moments');
    if (player.moments.length === 0) {
      list.appendChild(el('li', 'empty', 'Nothing has moved since the watch began.'));
    }

    let seen = null;
    for (const moment of player.moments) {
      if (moment.key !== seen) {
        list.appendChild(el('li', 'day',
          moment.date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })));
        seen = moment.key;
      }

      const item = el('li');
      const time = el('time', null,
        moment.date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }));
      time.dateTime = moment.at;
      item.appendChild(time);
      item.appendChild(el('span', 'where', `(${moment.x}|${moment.y})`));
      item.appendChild(el('span', `delta ${moment.delta < 0 ? 'down' : 'up'}`,
        (moment.delta > 0 ? '+' : '') + moment.delta));
      item.appendChild(el('span', 'pop', moment.population.toLocaleString()));
      item.appendChild(el('span', 'gap', `after ${span(moment.since)} quiet`));
      list.appendChild(item);
    }

    card.appendChild(list);
    return card;
  };

  /**
   * The longest stretch of hours that are busy, or that were watched and quiet. Hours nobody watched
   * break a quiet run rather than extending it - an unwatched hour is not a quiet one.
   */
  function run(byHour, watched, busy) {
    const matches = (hour) => busy
      ? byHour[hour] > 0
      : (watched[hour] || 0) > 0 && !byHour[hour];

    let all = true;
    for (let hour = 0; hour < HOURS; hour++) if (!matches(hour)) all = false;
    if (all) return null;

    let best = null;
    let bestScore = 0;
    for (let start = 0; start < HOURS; start++) {
      if (!matches(start) || matches((start + HOURS - 1) % HOURS)) continue;

      let length = 0;
      let weight = 0;
      while (length < HOURS && matches((start + length) % HOURS)) {
        weight += byHour[(start + length) % HOURS] || 0;
        length++;
      }

      // Busiest is by weight - a long thin stretch is not a busier time than a short crowded one.
      const score = busy ? weight * 100 + length : length;
      if (score > bestScore) {
        bestScore = score;
        best = `${String(start).padStart(2, '0')}-${String((start + length - 1) % HOURS).padStart(2, '0')}`;
      }
    }

    return best;
  }

  const cards = new Map();
  for (const player of players) {
    const card = detail(player);
    cards.set(player.name, card);
    page.appendChild(card);
  }

  function open(name) {
    for (const [key, card] of cards) card.classList.toggle('open', key === name);
    const card = cards.get(name);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  if (players.length === 1) open(players[0].name);

  const caveat = el('p', 'caveat',
    'Hours are yours, not theirs. A mark is a population change — a building finishing, which trails '
    + 'whenever it was queued, so this is activity rather than proof of being online. An hour is only '
    + 'quiet where somebody was watching it; hatched hours are ones nothing is known about.'
    + (data.unwatchedHours > 0
      ? ` ${data.unwatchedHours} hour${data.unwatchedHours === 1 ? ' of the day has' : 's of the day have'} never been watched.`
      : ''));
  page.appendChild(caveat);

  /* ---- the passcode curtain ------------------------------------------ */

  const gate = $('gate');
  if (gate && data.passcode !== undefined) {
    const field = $('gateInput');
    const message = $('gateMessage');
    $('gateForm').addEventListener('submit', (event) => {
      event.preventDefault();
      if (field.value.trim() !== String(data.passcode)) {
        message.textContent = 'No.';
        field.select();
        return;
      }

      gate.remove();
    });
  } else if (gate) {
    gate.remove();
  }
})();

</script>
</body>
</html>
