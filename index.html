<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVN world map</title>
<style>
/* Styles for the generated world map page. Inlined into the output by HtmlMapRenderer. */

:root {
  color-scheme: light dark;

  --ruler-w: 58px;
  --ruler-h: 26px;

  --bg: #eef0f4;
  --panel-bg: #ffffff;
  --panel-border: #d5d9e0;
  --text: #1d2129;
  --text-dim: #6b7280;
  --map-bg: #fbfbfa;
  --grid-minor: #e7e9ee;
  --grid-major: #c9cfd9;
  --axis: #98a2b3;
  --accent: #2f6feb;
  --hover: #1d2129;
  --capital-ring: #ffffff;
  --marker-text: #ffffff;
  --shadow: 0 1px 3px rgba(15, 23, 42, .14);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216;
    --panel-bg: #1a1d23;
    --panel-border: #2b3039;
    --text: #e6e8ec;
    --text-dim: #98a2b3;
    --map-bg: #0c0e12;
    --grid-minor: #1c2028;
    --grid-major: #2d343f;
    --axis: #4f5a70;
    --accent: #5b9dff;
    --hover: #e6e8ec;
    --capital-ring: #ffffff;
    --marker-text: #ffffff;
    --shadow: 0 1px 3px rgba(0, 0, 0, .55);
  }
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- toolbar ---------- */

.toolbar {
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding: 7px 12px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--panel-border);
}

.brand {
  font-weight: 600;
  font-size: 14px;
}

.toolbar button {
  font: inherit;
  color: var(--text);
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 5px;
  padding: 3px 9px;
  cursor: pointer;
  min-width: 28px;
}

.toolbar button:hover { border-color: var(--accent); color: var(--accent); }

.group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.group label {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-dim);
}

.group input {
  font: inherit;
  width: 62px;
  padding: 3px 6px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--panel-border);
  border-radius: 5px;
}

.group select {
  font: inherit;
  padding: 3px 6px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--panel-border);
  border-radius: 5px;
}

.group select:disabled { opacity: .5; }

.group input[type="range"] {
  width: 130px;
  padding: 0;
  background: none;
  border: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

#minPopValue { min-width: 84px; }

.growth-key {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-dim);
}

.growth-key i {
  width: 11px;
  height: 11px;
  border-radius: 2px;
  box-shadow: inset 0 0 0 2px currentColor;
}

.growth-key i.dashed {
  box-shadow: none;
  border: 2px dashed currentColor;
}

#zoomLabel {
  min-width: 46px;
  text-align: center;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.readout {
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  min-width: 190px;
}

.readout b { color: var(--text); font-weight: 600; }

/* ---------- alliance filter ---------- */

.filter {
  position: relative;
  margin-left: auto;
}

.filter-state { color: var(--text-dim); }

.filter-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 20;
  width: 300px;
  max-height: min(70vh, 520px);
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  box-shadow: var(--shadow), 0 8px 24px rgba(0, 0, 0, .18);
}

.filter-panel[hidden] { display: none; }

.filter-actions {
  flex: none;
  padding: 6px 10px;
  border-bottom: 1px solid var(--panel-border);
}

.filter-actions label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-weight: 600;
}

.filter-actions input { margin: 0; }

.filter-list {
  overflow: auto;
  padding: 4px;
}

.filter-list label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
}

.filter-list label:hover { background: var(--bg); }

.filter-list label.lead { font-weight: 600; }

.filter-list .sep {
  margin: 5px 6px;
  border-top: 1px solid var(--panel-border);
}

.filter-list input { margin: 0; flex: none; }

.filter-list i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex: none;
  background: currentColor;
}

.filter-list .nm {
  flex: 1;
  min-width: 0;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-list .ct {
  flex: none;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ---------- stage ---------- */

.stage {
  flex: 1;
  min-height: 0;
  display: flex;
}

.map-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.viewport {
  position: absolute;
  inset: 0;
  overflow: auto;
  display: grid;
  grid-template-columns: var(--ruler-w) max-content;
  grid-template-rows: var(--ruler-h) max-content;
  background: var(--bg);
  overscroll-behavior: contain;
  cursor: grab;
}

.viewport.panning {
  cursor: grabbing;
  user-select: none;
}

.viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.corner {
  grid-area: 1 / 1;
  position: sticky;
  top: 0;
  left: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-dim);
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  border-bottom: 1px solid var(--panel-border);
}

.ruler {
  position: relative;
  z-index: 3;
  background: var(--panel-bg);
  user-select: none;
}

.ruler-x {
  grid-area: 1 / 2;
  position: sticky;
  top: 0;
  border-bottom: 1px solid var(--panel-border);
}

.ruler-y {
  grid-area: 2 / 1;
  position: sticky;
  left: 0;
  border-right: 1px solid var(--panel-border);
}

.tick {
  position: absolute;
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.ruler-x .tick { top: 50%; transform: translate(-50%, -50%); }

.ruler-y .tick { left: 50%; transform: translate(-50%, -50%); }

.tick.zero { color: var(--accent); font-weight: 600; }

/* ---------- map surface ---------- */

.surface {
  grid-area: 2 / 2;
  position: relative;
  width: calc(var(--cols) * var(--cell));
  height: calc(var(--rows) * var(--cell));
  background-color: var(--map-bg);
  /* Major lines first so they paint over the minor grid. */
  background-image:
    linear-gradient(to right, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right, var(--grid-minor) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-minor) 0 1px, transparent 1px);
  background-size:
    calc(var(--cell) * var(--major)) 100%,
    100% calc(var(--cell) * var(--major)),
    var(--cell) 100%,
    100% var(--cell);
  background-position:
    calc(var(--major-offset-x) * var(--cell)) 0,
    0 calc(var(--major-offset-y) * var(--cell)),
    0 0,
    0 0;
}

.axis-v,
.axis-h,
.origin { position: absolute; pointer-events: none; }

.axis-v {
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--axis);
  left: calc(var(--axis-col) * var(--cell));
}

.axis-h {
  left: 0;
  right: 0;
  height: 1px;
  background: var(--axis);
  top: calc(var(--axis-row) * var(--cell));
}

.origin {
  width: var(--cell);
  height: var(--cell);
  left: calc(var(--axis-col) * var(--cell));
  top: calc(var(--axis-row) * var(--cell));
  outline: 1px solid var(--accent);
  outline-offset: -1px;
}

.overlay {
  position: absolute;
  left: var(--ruler-w);
  top: var(--ruler-h);
  pointer-events: none;
}

/* ---------- details panel ---------- */

.details {
  flex: none;
  width: 290px;
  padding: 14px 16px 20px;
  overflow: auto;
  background: var(--panel-bg);
  border-left: 1px solid var(--panel-border);
  box-shadow: var(--shadow);
}

.details[hidden] { display: none; }

.details-head {
  display: flex;
  align-items: start;
  gap: 8px;
}

.details-head h2 {
  margin: 0;
  font-size: 15px;
  line-height: 1.3;
  flex: 1;
  word-break: break-word;
}

.details-head .close {
  font: inherit;
  font-size: 16px;
  line-height: 1;
  color: var(--text-dim);
  background: none;
  border: 0;
  padding: 2px 4px;
  cursor: pointer;
}

.details-head .close:hover { color: var(--text); }

.details-coord {
  margin: 2px 0 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.details dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 12px;
  margin: 0;
}

.details dt { color: var(--text-dim); }

.details dd {
  margin: 0;
  word-break: break-word;
  white-space: pre-line; /* the change list is one line per day */
  font-variant-numeric: tabular-nums;
}

.details .tribe-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: baseline;
}

.details .muted { color: var(--text-dim); }

.details .history {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--panel-border);
}

.details .history-title {
  color: var(--text-dim);
  margin-bottom: 6px;
}

.details .history-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  padding: 3px 0;
  font-variant-numeric: tabular-nums;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-border) 55%, transparent);
}

.details .history-row:last-child { border-bottom: 0; }

.details .history-row .date { color: var(--text-dim); }

.details .history-row .pop { text-align: right; }

.details .history-row .delta { font-weight: 600; text-align: right; min-width: 46px; }

.details .owned {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--panel-border);
}

.details .owned-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  padding: 4px 6px;
  margin: 1px 0;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: none;
  border: 0;
  border-radius: 5px;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}

.details .owned-row:hover { background: var(--bg); }

.details .owned-row.current {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  font-weight: 600;
}

.details .owned-row .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.details .owned-row .at { color: var(--text-dim); }

.details .owned-row .pop { min-width: 42px; text-align: right; }

.details .badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  color: #fff;
  vertical-align: middle;
  white-space: nowrap;
}

@media (max-width: 760px) {
  .stage { flex-direction: column; }

  .details {
    width: auto;
    max-height: 45%;
    border-left: 0;
    border-top: 1px solid var(--panel-border);
  }

  .legend { display: none; }
}

</style>
<style>
:root {
  --cell: 24px;
  --cols: 401;
  --rows: 401;
  --major: 10;
  --major-offset-x: 0;
  --major-offset-y: 0;
  --axis-col: 200;
  --axis-row: 200;
}
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <span class="brand">TVN world map</span>
    <div class="group">
      <button id="zoomOut" type="button" title="Zoom out (-)">&minus;</button>
      <span id="zoomLabel">24 px</span>
      <button id="zoomIn" type="button" title="Zoom in (+)">+</button>
      <button id="zoomReset" type="button" title="Back to the starting view">Reset</button>
    </div>
    <form class="group" id="jumpForm">
      <label>X <input id="jumpX" type="number" step="1" value="-96" min="-200" max="200"></label>
      <label>Y <input id="jumpY" type="number" step="1" value="-38" min="-200" max="200"></label>
      <button type="submit">Go</button>
    </form>
    <div class="group">
      <label for="minPop">Pop &ge;</label>
      <input id="minPop" type="range" min="0" max="500" step="10" value="0">
      <span class="filter-state" id="minPopValue">0</span>
    </div>
    <div class="group">
      <label for="changeDays">Changed</label>
      <select id="changeDays">
        <option value="0" selected>any time</option>
        <option value="1">last 1 day</option>
        <option value="2">last 2 days</option>
        <option value="3">last 3 days</option>
        <option value="7">last 7 days</option>
        <option value="14">last 14 days</option>
        <option value="30">last 30 days</option>
      </select>
      <span class="filter-state" id="changeCount"></span>
      <span class="growth-key" id="growthKey"><i></i>growing</span>
      <span class="growth-key" id="declineKey"><i class="dashed"></i>shrinking</span>
    </div>
    <label class="group" id="cropperGroup">
      <input id="croppersOnly" type="checkbox">
      <span>9c / 15c only</span>
      <span class="filter-state" id="cropperCount"></span>
    </label>
    <span class="readout" id="readout">&mdash;</span>
    <div class="filter" id="filter">
      <button id="filterButton" type="button" aria-expanded="false" aria-controls="filterPanel">
        Alliances <span class="filter-state" id="filterState"></span>
      </button>
      <div class="filter-panel" id="filterPanel" hidden>
        <div class="filter-actions">
          <label>
            <input id="filterToggleAll" type="checkbox" checked>
            <span>All alliances</span>
          </label>
        </div>
        <div class="filter-list" id="filterList"></div>
      </div>
    </div>
  </header>
  <div class="stage">
    <div class="map-wrap">
      <div class="viewport" id="viewport" tabindex="0">
        <div class="corner">Y&nbsp;&uarr;</div>
        <div class="ruler ruler-x" id="rulerX"></div>
        <div class="ruler ruler-y" id="rulerY"></div>
        <div class="surface" id="surface"><div class="axis-v"></div><div class="axis-h"></div><div class="origin"></div></div>
      </div>
      <canvas class="overlay" id="overlay"></canvas>
    </div>
    <aside class="details" id="details" hidden></aside>
  </div>
</div>

      let font = fonts.get(digits);
      if (!font) {
        // Shrink to fit the cell once the number gets long, so 4 digits never spill over the marker.
        const size = Math.max(8, Math.min(
          Math.round(cell * 0.34),
          Math.floor((cell - pad * 2 - 2) / (digits * 0.62))));
        font = size + 'px system-ui, sans-serif';
        fonts.set(digits, font);
      }
      return font;
    };
    if (withPop) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
    }

    const paint = (v) => {
      if (!isVisible(v)) return;
      const px = v.col * cell - sx;
      const py = v.gridRow * cell - sy;
      const ally = ALLIANCES[v.alliance];
      const outlined = v.alliance === 0 && !v.home && cell >= 10;
      const colour = v.home ? HOME.color : allianceColor(ally);

      // Highlighted villages draw at full strength; the rest recede but stay on the map.
      const owned = selectedPlayer !== null && v.player === selectedPlayer;
      const lit = isLit(v);
      ctx.globalAlpha = lit ? 1 : 0.25;

      if (rounded) {
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, radius);
      }

      if (outlined) {
        ctx.strokeStyle = colour;
        ctx.lineWidth = Math.max(1, cell / 16);
        if (rounded) {
          ctx.stroke();
        } else {
          ctx.strokeRect(px + pad + 0.5, py + pad + 0.5, size - 1, size - 1);
        }
      } else {
        ctx.fillStyle = colour;
        if (rounded) {
          ctx.fill();
        } else {
          ctx.fillRect(px + pad, py + pad, size, size);
        }
      }

      // Trend ring around the whole cell: it lands in the gap outside the marker, so it stays
      // legible whatever the alliance fill is, and never collides with the capital ring inside.
      // Growth is solid green, decline dashed red - the dash is what separates it from the other
      // reds on the page rather than the hue alone.
      if (v.trend !== 0 && cell >= 8) {
        const width = Math.max(1.5, cell / 9);
        ctx.strokeStyle = v.trend > 0 ? GROWTH_COLOR : DECLINE_COLOR;
        ctx.lineWidth = width;
        if (v.trend < 0) {
          ctx.setLineDash([Math.max(2, cell / 4), Math.max(1.5, cell / 7)]);
        }

        ctx.strokeRect(px + width / 2, py + width / 2, cell - width, cell - width);
        ctx.setLineDash([]);
      }

      if (v.capital && cell >= 8 && !outlined) {
        ctx.lineWidth = Math.max(1, cell / 14);
        ctx.strokeStyle = theme.capitalRing;
        if (rounded) {
          ctx.stroke();
        } else {
          ctx.strokeRect(px + pad + 0.5, py + pad + 0.5, size - 1, size - 1);
        }
      }

      if (withPop && v.pop > 0) {
        const text = String(v.pop);
        ctx.font = popFont(text.length);
        ctx.fillStyle = outlined ? colour : readableInk(colour);
        ctx.fillText(text, px + cell / 2, py + cell / 2);
      }

      if (owned && lit && cell >= 6) {
        const width = Math.max(1, cell / 12);
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = width;
        ctx.strokeRect(px + width / 2, py + width / 2, cell - width, cell - width);
      }

      ctx.globalAlpha = 1;
    };

    // Whichever is cheaper: walk the villages, or walk the visible cells.
    const visibleCells = (c1 - c0 + 1) * (r1 - r0 + 1);
    if (list.length <= visibleCells) {
      for (const v of list) {
        if (v.col >= c0 && v.col <= c1 && v.gridRow >= r0 && v.gridRow <= r1) paint(v);
      }
    } else {
      for (let row = r0; row <= r1; row++) {
        const base = row * COLS;
        for (let col = c0; col <= c1; col++) {
          const v = byIndex.get(base + col);
          if (v) paint(v);
        }
      }
    }

    // Ring the home cell whether or not a village record sits there, so it is findable at any zoom.
    if (HOME) {
      strokeCell(HOME, HOME.color, cell >= 16 ? 2 : 1);
    }

    if (hover && !(selected && hover.x === selected.x && hover.y === selected.y)) {
      strokeCell(hover, theme.hover, 1);
    }
    if (selected) {
      strokeCell(selected, theme.accent, 2);
    }
  }

  function strokeCell(coord, color, width) {
    const px = (coord.x - B.minX) * cell - viewport.scrollLeft;
    const py = (B.maxY - coord.y) * cell - viewport.scrollTop;
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.strokeRect(px + width / 2, py + width / 2, cell - width, cell - width);
  }

  // ---------- coordinates ----------

  function coordFromEvent(event) {
    const rect = viewport.getBoundingClientRect();
    const vx = event.clientX - rect.left - viewport.clientLeft;
    const vy = event.clientY - rect.top - viewport.clientTop;
    if (vx < RULER_W || vy < RULER_H || vx > viewport.clientWidth || vy > viewport.clientHeight) {
      return null;
    }
    const col = Math.floor((viewport.scrollLeft + vx - RULER_W) / cell);
    const row = Math.floor((viewport.scrollTop + vy - RULER_H) / cell);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
    return { x: col + B.minX, y: B.maxY - row, col, gridRow: row };
  }

  const tileAt = (coord) => tileByIndex.get(coord.gridRow * COLS + coord.col) || null;

  /**
   * The resource field layout. Travian only publishes it for empty valleys, so an occupied cell has
   * one only if we scanned it before it was settled - hence "not scanned yet" rather than silence.
   */
  function addFieldRow(dl, coord) {
    const tile = tileAt(coord);
    if (tile && tile.layout) {
      const crop = tile.layout[4];
      addRow(dl,
        'Resource fields',
        crop >= 9 ? tile.layout[0] + '  ' + crop + '-cropper' : tile.layout[0],
        crop >= 9 ? pick(data.cropperColor, '#7b2ff2') : null);
    } else {
      addRow(dl, 'Resource fields', 'not scanned yet');
    }
  }

  /** Filtered-out villages are not on the map, so they are not selectable or hoverable either. */
  function villageAt(coord) {
    const village = byIndex.get(coord.gridRow * COLS + coord.col);
    return village && isVisible(village) ? village : null;
  }

  function centerOn(x, y) {
    const { w, h } = mapRect();
    viewport.scrollLeft = (x - B.minX + 0.5) * cell - w / 2;
    viewport.scrollTop = (B.maxY - y + 0.5) * cell - h / 2;
  }

  // ---------- zoom ----------

  function setZoom(index, anchorX, anchorY) {
    const next = clamp(index, 0, ZOOMS.length - 1);
    if (next === zoomIndex) return;

    const { w, h } = mapRect();
    const ax = anchorX === undefined ? w / 2 : clamp(anchorX, 0, w);
    const ay = anchorY === undefined ? h / 2 : clamp(anchorY, 0, h);
    const unitsX = (viewport.scrollLeft + ax) / cell;
    const unitsY = (viewport.scrollTop + ay) / cell;

    zoomIndex = next;
    cell = ZOOMS[zoomIndex];
    rootStyle.setProperty('--cell', cell + 'px');
    zoomLabel.textContent = cell + ' px';

    void viewport.scrollWidth; // flush layout so the new surface size is in effect
    viewport.scrollLeft = unitsX * cell - ax;
    viewport.scrollTop = unitsY * cell - ay;

    buildRulers();
    schedule();
  }

  // ---------- details panel ----------

  function addRow(dl, label, value, colour) {
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    if (colour) {
      const dot = document.createElement('span');
      dot.className = 'tribe-dot';
      dot.style.background = colour;
      dd.appendChild(dot);
    }
    dd.appendChild(document.createTextNode(value));
    dl.append(dt, dd);
  }

  /**
   * The village's whole population history, newest first: the day, the population it reached that
   * day, and the change. The running total is walked backwards from today's population.
   */
  function buildHistory(v) {
    const box = document.createElement('div');
    box.className = 'history';

    const title = document.createElement('div');
    title.className = 'history-title';
    title.textContent = 'Population history';
    box.appendChild(title);

    if (v.history.length === 0) {
      const none = document.createElement('p');
      none.className = 'muted';
      none.textContent = 'No change recorded yet.';
      box.appendChild(none);
      return box;
    }

    let running = v.pop;
    for (let i = v.history.length - 1; i >= 0; i--) {
      const [day, delta] = v.history[i];
      const row = document.createElement('div');
      row.className = 'history-row';

      const date = document.createElement('span');
      date.className = 'date';
      date.textContent = DATES[day];

      const population = document.createElement('span');
      population.className = 'pop';
      population.textContent = running.toLocaleString();

      const change = document.createElement('span');
      change.className = 'delta';
      change.textContent = signed(delta);
      if (delta > 0) change.style.color = GROWTH_COLOR;

      row.append(date, population, change);
      box.appendChild(row);
      running -= delta;
    }

    return box;
  }

  /** Every village the owner holds, clickable to jump to it. */
  function buildOwnedVillages(v) {
    const owned = byPlayer.get(v.player) || [];
    const box = document.createElement('div');
    box.className = 'owned';

    const title = document.createElement('div');
    title.className = 'history-title';
    title.textContent = v.player + ' — ' + owned.length + (owned.length === 1 ? ' village' : ' villages');
    box.appendChild(title);

    for (const village of owned) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = village === v ? 'owned-row current' : 'owned-row';

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = (village.capital ? '★ ' : '') + village.name;

      const at = document.createElement('span');
      at.className = 'at';
      at.textContent = '(' + village.x + '|' + village.y + ')';

      const population = document.createElement('span');
      population.className = 'pop';
      population.textContent = village.pop.toLocaleString();

      row.append(name, at, population);
      row.addEventListener('click', () => focusVillage(village));
      box.appendChild(row);
    }

    return box;
  }

  /** Centres the map on a village and selects it, as if it had been clicked on the map. */
  function focusVillage(village) {
    selected = { x: village.x, y: village.y, col: village.col, gridRow: village.gridRow };
    centerOn(village.x, village.y);
    showDetails(selected);
    schedule();
  }

  function closeDetails() {
    selected = null;
    selectedPlayer = null;
    details.hidden = true;
    schedule();
  }

  function showDetails(coord) {
    if (!coord) {
      closeDetails();
      return;
    }
    const v = villageAt(coord);
    const isHome = HOME !== null && coord.x === HOME.x && coord.y === HOME.y;
    selectedPlayer = v && v.player ? v.player : null;

    const head = document.createElement('div');
    head.className = 'details-head';
    const title = document.createElement('h2');
    title.textContent = v ? v.name : (isHome && HOME.name ? HOME.name : 'Empty cell');
    if (isHome) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = HOME.color;
      badge.textContent = 'your village';
      title.append(' ', badge);
    }
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'close';
    close.title = 'Close (Esc)';
    close.textContent = '×';
    close.addEventListener('click', closeDetails);
    head.append(title, close);

    const coordEl = document.createElement('div');
    coordEl.className = 'details-coord';
    coordEl.textContent = '(' + coord.x + '|' + coord.y + ')';

    details.replaceChildren(head, coordEl);

    if (v) {
      const dl = document.createElement('dl');
      const ally = ALLIANCES[v.alliance];
      addRow(dl, 'Player', v.player || '—');
      addRow(dl, 'Alliance', ally.name || '—', ally.name ? allianceColor(ally) : null);
      addRow(dl, 'Tribe', TRIBES[v.tribe] || 'Unknown', COLORS[v.tribe]);
      addRow(dl, 'Population', v.pop ? v.pop.toLocaleString() : '—');
      addRow(dl, 'Last 7 days', signed(changeOverDays(v, 7)));
      addRow(dl, 'Capital', v.capital ? 'Yes' : 'No');
      addFieldRow(dl, coord);
      details.append(dl);
      details.append(buildHistory(v));
      if (v.player) {
        details.append(buildOwnedVillages(v));
      }
    } else {
      const tile = tileAt(coord);
      if (tile) {
        const dl = document.createElement('dl');
        addRow(dl, 'Tile', TILE_KINDS[tile.kind] || 'unknown');
        addFieldRow(dl, coord);
        details.append(dl);
      }

      const empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = isHome
        ? 'Your village has no record in the store yet — import one for this coordinate.'
        : tile ? 'No village on this coordinate.' : 'No village here, and this cell has not been scanned yet.';
      details.append(empty);
    }

    details.hidden = false;
  }

  function updateReadout(coord) {
    if (!coord) {
      readout.textContent = '—';
      return;
    }
    const v = villageAt(coord);
    readout.replaceChildren();
    const position = document.createElement('b');
    position.textContent = '(' + coord.x + '|' + coord.y + ')';
    readout.append(position);
    if (v) {
      const ally = ALLIANCES[v.alliance].name;
      readout.append(document.createTextNode(
        '  ' + v.name
        + (v.player ? ' · ' + v.player : '')
        + (ally ? ' · ' + ally : '')
        + (v.pop ? ' · ' + v.pop : '')));
    }
  }

  // ---------- legend ----------

  // ---------- alliance filter ----------

  /** Alliance indexes whose villages are currently hidden. */
  const hidden = new Set();
  const rows = [];

  /** 0 = show every village; otherwise only those whose population moved in the last N days. */
  let changeDays = 0;

  const GROWTH_COLOR = data.growthColor || '#0ca30c';
  const DECLINE_COLOR = data.declineColor || '#d03b3b';

  const pick = (pair, fallback) => (pair ? pair[dark ? 1 : 0] : fallback);
  /** true = only 9- and 15-crop valleys are drawn in the field layer. */
  let croppersOnly = false;

  /**
   * Flags which way each village moved over the selected window, so the draw loop only has to read
   * a number. Recomputed whenever the window changes.
   */
  function refreshTrend() {
    const since = changeDays === 0 ? -Infinity : NEWEST - (changeDays - 1) * 86400000;
    for (const village of list) {
      let total = 0;
      for (const [day, delta] of village.history) {
        if (DATE_MS[day] >= since) total += delta;
      }

      village.trend = Math.sign(total);
    }
  }

  function isVisible(v) {
    if (hidden.has(v.alliance)) return false;
    if (changeDays === 0) return true;
    const since = NEWEST - (changeDays - 1) * 86400000;
    for (const [day] of v.history) {
      if (DATE_MS[day] >= since) return true;
    }
    return false;
  }

  function refreshMinPopLabel() {
    const label = $('minPopValue');
    if (minPopulation === 0) {
      label.textContent = '0';
      return;
    }

    let lit = 0;
    for (const village of list) {
      if (isVisible(village) && isLit(village)) lit++;
    }

    label.textContent = minPopulation + ' · ' + lit.toLocaleString();
  }

  function refreshChangeCount() {
    const label = $('changeCount');
    label.textContent = changeDays === 0
      ? ''
      : list.reduce((n, v) => n + (isVisible(v) ? 1 : 0), 0).toLocaleString() + ' shown';
  }

  function buildFilter() {
    const listEl = $('filterList');
    const frag = document.createDocumentFragment();

    const separator = () => {
      const line = document.createElement('div');
      line.className = 'sep';
      frag.appendChild(line);
    };

    const row = (indexes, colour, name, count, sw, options) => {
      const settings = options || {};
      const label = document.createElement('label');
      if (settings.lead) label.className = 'lead';
      label.style.color = colour;

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = true;

      const swatch = document.createElement('i');
      if (settings.outlined) {
        swatch.style.background = 'transparent';
        swatch.style.boxShadow = 'inset 0 0 0 1.5px currentColor';
      }

      const nameEl = document.createElement('span');
      nameEl.className = 'nm';
      nameEl.textContent = name;

      const countEl = document.createElement('span');
      countEl.className = 'ct';
      countEl.textContent = sw > 0 ? count + ' · ' + sw + ' SW' : String(count);

      label.append(box, swatch, nameEl, countEl);
      box.addEventListener('change', () => {
        apply(indexes, box.checked);
        updateFilterState();
        schedule();
      });

      rows.push({ box, indexes });
      frag.appendChild(label);
    };

    const first = ALLIANCES[0];
    if (first.listed) {
      row([0], allianceColor(first), 'No alliance', first.villages, first.sw, { lead: true, outlined: true });
    }

    let leadingDone = false;
    for (let i = 1; i < ALLIANCES.length; i++) {
      const ally = ALLIANCES[i];
      if (!ally.listed) continue;
      if (!ally.lead && !leadingDone) {
        leadingDone = true;
        separator();
      }
      row([i], allianceColor(ally), ally.name, ally.villages, ally.sw, { lead: ally.lead });
    }

    if (OTHER) {
      const indexes = [];
      for (let i = 1; i < ALLIANCES.length; i++) {
        if (!ALLIANCES[i].listed) indexes.push(i);
      }
      separator();
      row(indexes, allianceColor(OTHER), 'All other alliances', OTHER.villages, 0, {});
    }

    listEl.replaceChildren(frag);
    updateFilterState();
  }

  function apply(indexes, visible) {
    for (const i of indexes) {
      if (visible) {
        hidden.delete(i);
      } else {
        hidden.add(i);
      }
    }
  }

  function setAll(visible) {
    for (const entry of rows) {
      entry.box.checked = visible;
      apply(entry.indexes, visible);
    }
    updateFilterState();
    schedule();
  }

  function updateFilterState() {
    const shown = rows.filter((entry) => entry.box.checked).length;
    $('filterState').textContent = shown === rows.length ? 'all' : shown + '/' + rows.length;

    // The master checkbox shows a dash while only some alliances are on.
    const master = $('filterToggleAll');
    master.checked = shown === rows.length;
    master.indeterminate = shown > 0 && shown < rows.length;

    refreshChangeCount(); // the counts depend on every filter
    refreshMinPopLabel();
  }

  function closeFilter() {
    $('filterPanel').hidden = true;
    $('filterButton').setAttribute('aria-expanded', 'false');
  }

  // ---------- events ----------

  viewport.addEventListener('scroll', schedule, { passive: true });

  // Drag with the left button to pan. A short drag is still a click, so selecting a cell keeps working.
  const DRAG_THRESHOLD = 4;
  let drag = null;
  let swallowClick = false;

  viewport.addEventListener('pointerdown', (event) => {
    swallowClick = false;
    if (event.button !== 0 || event.pointerType === 'touch') return; // touch keeps native scrolling
    drag = {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      scrollLeft: viewport.scrollLeft,
      scrollTop: viewport.scrollTop,
      moved: false,
    };
    try {
      viewport.setPointerCapture(event.pointerId); // keeps the pan alive outside the viewport
    } catch {
      // The pointer was already released; panning still works through the normal event flow.
    }
  });

  function endDrag(event) {
    if (!drag || drag.id !== event.pointerId) return;
    swallowClick = drag.moved;
    drag = null;
    viewport.classList.remove('panning');
    try {
      viewport.releasePointerCapture(event.pointerId);
    } catch {
      // Already released.
    }
  }

  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  viewport.addEventListener('pointermove', (event) => {
    if (drag && drag.id === event.pointerId) {
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (drag.moved || Math.abs(dx) + Math.abs(dy) >= DRAG_THRESHOLD) {
        if (!drag.moved) viewport.classList.add('panning');
        drag.moved = true;
        viewport.scrollLeft = drag.scrollLeft - dx;
        viewport.scrollTop = drag.scrollTop - dy;
      }
    }

    const coord = coordFromEvent(event);
    const changed = (coord === null) !== (hover === null)
      || (coord && hover && (coord.x !== hover.x || coord.y !== hover.y));
    hover = coord;
    if (changed) {
      updateReadout(coord);
      schedule();
    }
  });

  viewport.addEventListener('pointerleave', () => {
    hover = null;
    updateReadout(null);
    schedule();
  });

  viewport.addEventListener('click', (event) => {
    if (swallowClick) {
      swallowClick = false;
      return; // the pointer was panning, not picking a cell
    }
    const coord = coordFromEvent(event);
    if (!coord) return;
    selected = coord;
    showDetails(coord);
    schedule();
  });

  viewport.addEventListener('wheel', (event) => {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    const rect = viewport.getBoundingClientRect();
    setZoom(
      zoomIndex + (event.deltaY < 0 ? 1 : -1),
      event.clientX - rect.left - viewport.clientLeft - RULER_W,
      event.clientY - rect.top - viewport.clientTop - RULER_H);
  }, { passive: false });

  $('zoomIn').addEventListener('click', () => setZoom(zoomIndex + 1));
  $('zoomOut').addEventListener('click', () => setZoom(zoomIndex - 1));
  $('zoomReset').addEventListener('click', () => {
    setZoom(startZoom);
    centerOn(START_X, START_Y);
    schedule();
  });

  $('jumpForm').addEventListener('submit', (event) => {
    event.preventDefault();
    const x = clamp(parseInt($('jumpX').value, 10) || 0, B.minX, B.maxX);
    const y = clamp(parseInt($('jumpY').value, 10) || 0, B.minY, B.maxY);
    selected = { x, y, col: x - B.minX, gridRow: B.maxY - y };
    centerOn(x, y);
    showDetails(selected);
    schedule();
  });

  $('filterButton').addEventListener('click', (event) => {
    event.stopPropagation();
    const panel = $('filterPanel');
    panel.hidden = !panel.hidden;
    $('filterButton').setAttribute('aria-expanded', String(!panel.hidden));
  });

  $('filterToggleAll').addEventListener('change', (event) => setAll(event.target.checked));

  $('croppersOnly').addEventListener('change', (event) => {
    croppersOnly = event.target.checked;
    schedule();
  });

  $('minPop').addEventListener('input', (event) => {
    minPopulation = Number(event.target.value) || 0;
    refreshMinPopLabel();
    schedule();
  });

  $('changeDays').addEventListener('change', (event) => {
    changeDays = Number(event.target.value) || 0;
    refreshTrend();
    refreshChangeCount();
    schedule();
  });

  document.addEventListener('click', (event) => {
    if (!$('filter').contains(event.target)) closeFilter();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !$('filterPanel').hidden) {
      closeFilter();
      $('filterButton').focus();
      return;
    }
    if (event.target instanceof HTMLInputElement) {
      if (event.key === 'Escape') event.target.blur();
      return;
    }
    if (event.key === '+' || event.key === '=') {
      event.preventDefault();
      setZoom(zoomIndex + 1);
    } else if (event.key === '-' || event.key === '_') {
      event.preventDefault();
      setZoom(zoomIndex - 1);
    } else if (event.key === 'Escape') {
      closeDetails();
    }
  });

  // The viewport may still be unlaid-out while this script runs, which would make centring a no-op;
  // centre once the first real size arrives instead.
  let centred = false;
  function centreWhenReady() {
    if (centred || mapRect().w <= 0) return;
    centred = true;
    centerOn(START_X, START_Y);
  }

  new ResizeObserver(() => {
    resizeCanvas();
    centreWhenReady();
    schedule();
  }).observe(viewport);
  window.addEventListener('resize', () => { resizeCanvas(); schedule(); });
  darkQuery.addEventListener('change', (event) => {
    dark = event.matches;
    theme = readTheme();
    // The alliance palette has its own steps per surface, so the swatches need re-colouring.
    for (let i = 0, row = 0; i < ALLIANCES.length; i++) {
      if (ALLIANCES[i].listed && rows[row]) {
        rows[row].box.parentElement.style.color = allianceColor(ALLIANCES[i]);
        row++;
      }
    }
    schedule();
  });

  // ---------- start ----------

  rootStyle.setProperty('--cell', cell + 'px');
  zoomLabel.textContent = cell + ' px';
  if (scannedCount === 0) {
    $('croppersOnly').disabled = true;
    $('cropperGroup').title = 'Nothing scanned yet - import a tile scan to fill this in.';
  } else {
    $('cropperCount').textContent = scannedCount.toLocaleString() + ' scanned · ' + cropperCount + ' croppers';
  }

  if (DATES.length === 0) {
    // Nothing has been imported twice yet, so there is no change history to filter on.
    $('changeDays').disabled = true;
    $('changeDays').title = 'No population history yet - it builds up from the next import.';
  }

  $('growthKey').firstElementChild.style.color = GROWTH_COLOR;
  $('declineKey').firstElementChild.style.color = DECLINE_COLOR;
  refreshTrend();
  buildRulers();
  buildFilter();
  resizeCanvas();
  centreWhenReady();
  updateReadout(null);
  schedule();
})();

</script>
</body>
</html>
